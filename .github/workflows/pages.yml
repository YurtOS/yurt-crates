name: Deploy registry pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish crate]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage static registry
        run: |
          mkdir _site
          if [[ -f index.html ]]; then
            cp index.html _site/
          else
            printf '%s\n' '<!doctype html><title>Yurt crates</title><h1>Yurt crates</h1><p>No snapshot has been published yet.</p>' > _site/index.html
          fi
          [[ ! -f latest ]] || cp latest _site/
          [[ ! -d index ]] || cp -R index _site/
          [[ ! -d crates ]] || cp -R crates _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

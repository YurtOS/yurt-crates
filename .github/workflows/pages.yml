name: Deploy registry pages

on:
  workflow_run:
    workflows: [Check registry]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yurt-crates-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: fresh
        name: Verify checked commit is still current
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          deploy=false
          if [[ "$(git rev-parse origin/main)" != "$CHECKED_SHA" ]]; then
            echo "Skipping stale Pages deployment for $CHECKED_SHA"
          else
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Stage static registry
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          mkdir _site
          if [[ -f index.html ]]; then
            cp index.html _site/
          else
            printf '%s\n' '<!doctype html><title>Yurt crates</title><h1>Yurt crates</h1><p>No snapshot has been published yet.</p>' > _site/index.html
          fi
          [[ ! -f latest ]] || cp latest _site/
          [[ ! -d index ]] || cp -R index _site/
          [[ ! -d crates ]] || cp -R crates _site/
      - uses: actions/configure-pages@v5
        if: steps.fresh.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.deploy == 'true'
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.fresh.outputs.deploy == 'true'
